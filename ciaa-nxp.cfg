# Configuración del microcontrolador NXP LPC4337 para la EDU-CIAA (OpenOCD 0.11+)
transport select jtag

# Definir el chip de destino (Target)
set _CHIPNAME lpc4337
set _M4_TAPID 0x4ba00477

# Crear el TAP JTAG para el núcleo Cortex-M4
jtag newtap $_CHIPNAME m4 -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_M4_TAPID

# Crear el DAP (Debug Access Port) requerido en versiones modernas de OpenOCD
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.m4

# Definir el target de depuración asociando el DAP creado
set _TARGETNAME $_CHIPNAME.m4
target create $_TARGETNAME cortex_m -dap $_CHIPNAME.dap

# Configurar el tamaño de la memoria de trabajo (SRAM de la EDU-CIAA)
$_TARGETNAME configure -work-area-phys 0x10000000 -work-area-size 0x8000 -work-area-backup 0

# Definir el banco de flash para poder programar el micro
set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME lpc2000 0x1a000000 0x80000 0 0 $_TARGETNAME lpc4300 96000 calc_checksum

# El reset físico no está conectado más allá del buffer en la CIAA
reset_config none
cortex_m reset_config vectreset

# Velocidad del reloj JTAG (se configura a 2 MHz para que sea estable)
adapter speed 100